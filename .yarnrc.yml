approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false

# Add a 300 seconds timeout to avoid build failures in docker hub, which seems to be an acceptable workaround (see for example https://github.com/yarnpkg/yarn/issues/554)
httpTimeout: 300000

nodeLinker: node-modules

npmMinimalAgeGate: 0
